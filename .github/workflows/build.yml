name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev build-essential
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Force Accept SDK Licenses and Build
      run: |
        # Force the accept_sdk_license flag into your buildozer.spec file dynamically
        sed -i 's/#*android.accept_sdk_license.*/android.accept_sdk_license = True/' buildozer.spec || echo "android.accept_sdk_license = True" >> buildozer.spec
        
        # Run buildozer (the yes pipe catches any straggling prompts, || true stops the broken pipe crash)
        yes | buildozer -s android debug || true
        
        # Run it one more time cleanly to actually build the APK now that dependencies are downloaded
        buildozer -s android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: python-autolock-apk
        path: bin/*.apk